#
#
# ~chewygumxx/lazy.nvim.git
# ::: :/.github/workflows/ci.yml
#
#

# Derived from folke/github's reusable CI workflow, trimmed to what a
# personal, single-maintainer, never-upstreamed fork actually needs: format
# and lint checks, the test suite, and README -> vimdoc generation. Runs
# entirely within this repository instead of calling out to folke/github.
#
# Originally derived from:
#   https://github.com/folke/github/blob/main/.github/workflows/ci.yml
#   https://github.com/folke/github/blob/main/neovim/action.yml

name: CI

on:
  push:
    branches: [main, chewygumxx]
  pull_request:

jobs:
  stylua:
    name: Stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  selene:
    name: Selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install selene
        run: |
          curl -sSL https://github.com/Kampfkarren/selene/releases/latest/download/selene-light-linux.zip -o selene.zip
          unzip -j selene.zip selene -d /usr/local/bin
          chmod +x /usr/local/bin/selene
      - run: selene lua

  debug:
    name: Check that no debug messages are left
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Debug
        run: |
          if /bin/grep --line-number -r -P '^(?!\s*--).*\bdd\(' --color=always lua; then
            echo "Debug messages found"
            exit 1
          else
            echo "No debug messages found"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Neovim
        # Adapted from folke/github's neovim/action.yml composite action.
        run: |
          mkdir -p "$RUNNER_TEMP/nvim"
          curl -sL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.appimage \
            -o "$RUNNER_TEMP/nvim/nvim.appimage"
          cd "$RUNNER_TEMP/nvim"
          chmod a+x ./nvim.appimage
          ./nvim.appimage --appimage-extract
          echo "$RUNNER_TEMP/nvim/squashfs-root/usr/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev
      - name: Test cache
        uses: actions/cache@v5
        with:
          path: .tests
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/minit.lua', 'scripts/test') }}
      - name: Run tests
        run: ./scripts/test

  docs:
    name: Generate vimdoc
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: panvimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: lazy.nvim
          version: "Neovim"
          description: "lazy.nvim docs"
          demojify: true
          treesitter: true
      - name: Commit generated docs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(build): auto-generated vimdocs"
